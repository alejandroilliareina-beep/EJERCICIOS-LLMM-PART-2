<!DOCTYPE html>
<html lang="es">
<head>

    <title>Menús con Listas</title>
    <link rel="stylesheet" href="CSS/EJERCICIO 2.CSS">
</head>
<body>

    <div class="seccion">
        <p class="titulo-menu">lista no ordenada -> menu horizontal</p>

        <ul class="menu-horizontal">

            <li><a href="#">opcion2</a></li>
            <li><a href="#">opcion3</a></li>

    <div class="seccion">

        <ul class="menu-vertical">

            <li><a href="#">opcion1</a></li>
            <li><a href="#">opcion2</a></li>
            <li class="activo"><a href="#">opcion3</a></li>
            <li><a href="#">opcion4</a></li>
            <li><a href="#">opcion5</a></li>
             
        </ul>
    </div>

</body>
</html>
