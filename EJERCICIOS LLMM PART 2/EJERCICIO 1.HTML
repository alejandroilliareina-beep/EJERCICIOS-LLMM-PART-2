<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listas</title>
    <link rel="stylesheet" href="CSS/EJERCICIO 1.CSS">
</head>
<body>

    <!-- Sección de lista no ordenada -->
    <div class="seccion-titulo">
        <h2>lista no ordenada</h2>
    </div>

    <ul class="first-level">
        <li>opcion1</li>
        <li>opcion2
            <ul class="second-level">
                <li>opcion21</li>
                <li>opcion22</li>
            </ul>
        </li>
        <li>opcion3</li>
        <li>opcion4</li>
        <li>opcion5</li>
    </ul>

    <hr class="divisor">

    <!-- Sección de lista ordenada -->
    <div class="seccion-titulo">
        <h2>lista ordenada</h2>
    </div>

    <ol class="lista-principal-ordenada">
        <li>opcion1</li>
        <li>opcion2
            <ul class="second-level">
                <li>opcion21</li>
                <li>opcion22</li>
            </ul>
        </li>
        <li>opcion3</li>
        <li>opcion4
            <ol type="a" class="third-level">
                <li>opcion41
                    <ol type="i" class="fourth-level">
                        <li>opcion411</li>
                        <li>opcion412</li>
                    </ol>
                </li>
                <li>opcion42</li>
            </ol>
        </li>
        <li>opcion5</li>
    </ol>

    <hr class="divisor">

</body>
</html>
